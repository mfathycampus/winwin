name: keep-alive

# Pings the API so the free Render instance doesn't spin down (avoids the ~50s cold start).
on:
  schedule:
    - cron: '*/10 * * * *' # every 10 minutes
  workflow_dispatch: {}      # allow manual run

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          echo "Pinging WinWin API health..."
          curl -sS --max-time 90 https://winwin-api-4poq.onrender.com/health || echo "ping failed (server may be cold), will retry next run"
