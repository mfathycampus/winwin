# Render Blueprint for WinWin API
# Deploy: push this repo to GitHub, then on render.com → New → Blueprint → pick this repo.
# Creates: PostgreSQL + Redis (Key Value) + the Node API web service, all wired together.

databases:
  - name: winwin-db
    plan: free
    databaseName: winwin
    user: winwin

services:
  # ─── Redis (Key Value) ───────────────────────────────────────────────
  - type: keyvalue
    name: winwin-redis
    plan: free
    ipAllowList: [] # internal access only

  # ─── API (Express + TypeScript, run via tsx) ─────────────────────────
  - type: web
    name: winwin-api
    runtime: node
    plan: free
    branch: main
    buildCommand: >-
      npm install --include-workspace-root
      --workspace=@winwin/api
      --workspace=@winwin/db
      --workspace=@winwin/shared &&
      npx prisma generate --schema=packages/db/prisma/schema.prisma &&
      npx prisma migrate deploy --schema=packages/db/prisma/schema.prisma
    startCommand: npx tsx packages/api/src/index.ts
    healthCheckPath: /health
    envVars:
      # NODE_ENV=development keeps the fixed OTP 123456 working for testing.
      - key: NODE_ENV
        value: development
      - key: DATABASE_URL
        fromDatabase:
          name: winwin-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: winwin-redis
          property: connectionString
      - key: JWT_SECRET
        value: winwin_prod_jwt_secret_please_change_this_value_32chars_min
      - key: JWT_REFRESH_SECRET
        value: winwin_prod_refresh_secret_please_change_this_value_32chars_min
      - key: SMS_PROVIDER
        value: mock
      # Phone numbers that get the platform ADMIN role (comma-separated).
      - key: ADMIN_PHONES
        value: "+966568323752"
